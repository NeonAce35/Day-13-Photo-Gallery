<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.jpeg" type="x-icon/image">
    <title>Day 13</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }
        .gallery img {
            transition: transform 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <h1>My Photo Gallery</h1>
    <p>A collection of beautiful moments captured through photography.</p>
    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Beautiful scenery">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Mountain landscape">
        <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600" alt="Sunrise over a landscape">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="Beautiful lake">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Green forest">
        <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=600" alt="Ocean waves">
    </div>
</body>
</html>
